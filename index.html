<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main>
        <div class="left-div">
            <h1>My Task List 2026</h1>
            <form>
                <input id="form-input" type="text" placeholder="Enter Your Tasks.....">
                <button class="search-btn">Add Tasks</button>
            </form>
            <div class="todo-div">

            </div>
        </div>
        <div class="right-div">
            <div class="maximum-tasks">
                <h1>Tasks : </h1>
                 <div class="maximum-task">
                    <span id="task-count">0</span>/8
                 </div>
            </div>

            <div class="progress-div">
                 <h2>Task Range</h2>
                 <div class="progress">
                    <div class="progress-range">

                    </div>
                 </div>
            </div>


        </div>
    </main>





    <script src="./script.js"></script>
</body>
</html>
